name: dream_house
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  auto_route: 10.1.0+1
  crop_your_image: 0.7.5
  cupertino_icons: 1.0.8
  device_preview: 1.3.1
  dio: 5.9.0
  equatable: 2.0.7
  firebase_core: 4.0.0
  flutter_html: 3.0.0
  firebase_remote_config: 6.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  flutter_slidable: ^4.0.3
  flutter_staggered_grid_view: 0.7.0
  flutter_svg: 2.2.0
  get_it: 8.2.0
  image_picker: 1.2.0
  intl: 0.20.2
  logger: 2.6.0
  permission_handler: 12.0.1
  pretty_dio_logger: 1.4.0
  socket_io_client: ^3.1.2

dev_dependencies:
  auto_route_generator: 10.2.3
  build_runner: 2.5.4
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/app/
    - assets/images/alert/
    - assets/images/chat/
    - assets/images/floor_tiles/material/
    - assets/images/floor_tiles/type/
    - assets/images/fundament/material/
    - assets/images/fundament/type/
    - assets/images/home/
    - assets/images/idea/
    - assets/images/inner-wall/material/
    - assets/images/inner-wall/type/
    - assets/images/login/
    - assets/images/material/
    - assets/images/onboarding/
    - assets/images/profile/
    - assets/images/roof/calculation/
    - assets/images/roof/material/
    - assets/images/roof/shape/
    - assets/images/roof/type/
    - assets/images/underfloor/material/
    - assets/images/underfloor/type/
    - assets/images/wall/
    - assets/images/wall/material/
    - assets/images/wall/type/
    - assets/images/wall/wall-thickness/
    - assets/images/wall_decoration/material/
    - assets/images/wall_decoration/type/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Regular.ttf
          weight: 400

        - asset: assets/fonts/raleway/Raleway-Bold.ttf
          weight: 700

    - family: lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf
          weight: 400

        - asset: assets/fonts/lato/Lato-Medium.ttf
          weight: 500

        - asset: assets/fonts/lato/Lato-Semibold.ttf
          weight: 600

        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
